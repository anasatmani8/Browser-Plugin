<!DOCTYPE html>
<html lang="en">
<head>
    <title>Page Tools</title>
    <style>
        body { font-family: Arial, sans-serif; width: 220px; padding: 10px; }
        button { width: 100%; padding: 8px; margin-top: 10px; cursor: pointer; }
        select { width: 100%; padding: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Page Tools</h3>
    
    <!-- Background Color Changer -->
    <button id="changeColor">Change Background Color</button>

    <!-- Page Translator -->
    <h4>Translate Page</h4>
    <select id="language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ar">Arabic</option>
    </select>
    <button id="translateBtn">Translate</button>

    <script src="popup.js"></script>
</body>
</html>
